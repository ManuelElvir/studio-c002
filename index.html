<style>

:root[data-theme="dark"]{--scene:#1A1E22;--ink:#E8EAEC;--muted:#A3AAB1;--panel:rgba(32,37,42,.92);--line:rgba(255,255,255,.12);--accent:#A8C49F;--accent-ink:#16201A;--cine:#C9C6F2;--cine-ink:#1A1930;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit;}

.variants{top:112px;}
.variants button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}

.modes button:focus-visible,.views button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.caption.collapsed #caption{display:none;}

.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:2rem;text-align:center;color:var(--muted);}
</style>
</head>

  nuit:{pos:[3.0,1.75,3.4],target:[3.0,.75,.3],txt:'<strong>Coin nuit.</strong> À gauche, table d’appoint en C tout en chêne : le pied se glisse sous le lit, le plateau passe au-dessus du matelas, avec une petite lampe terre cuite. À droite, côté bureau, un lampadaire avec une tablette pour le téléphone ou un livre. Miroir adhésif pleine hauteur sur le placard coulissant, qui monte jusqu’au plafond, télé escamotable au pied du lit.'},
  repas:{pos:[2.2,1.8,4.3],target:[4.3,.9,3.0],txt:'<strong>Repas.</strong> Trois chaises en triangle : deux côté fenêtre, une seule côté entrée en terre cuite, qui casse l’harmonie. La table est à 1 m du frigo et laisse environ 75 cm de passage devant le meuble télé. La grande plante reste devant la petite fenêtre.'},
  bureau:{pos:[3.2,1.6,1.9],target:[5.0,1.0,.7],txt:'<strong>Bureau.</strong> Dans l’angle, contre le mur aux cinq prises, fenêtre à droite pour une lumière de côté sans reflet sur l’écran. Rideaux en lin sur tringles serrées sur les coffres de volets roulants, sans perçage. Le radiateur entre les fenêtres reste dégagé. À gauche de la grande fenêtre, une étagère à pression sol-plafond pour deux plantes, tes livres préférés, la manette et une figurine. Bureau assis-debout rangé en position haute, chaise dessous : passe en Travail pour le descendre et sortir la chaise.'},
  cuisine:{pos:[2.7,1.75,3.0],target:[2.8,.9,5.3],txt:'<strong>Cuisine.</strong> Évier du bailleur conservé, trois tiroirs à la place du lave-vaisselle, four combiné micro-ondes sous la plaque, frigo deux portes contre le placard. Égouttoir compact, barre adhésive sur la crédence, façades chêne et poignées noires, niche tapissée du même papier peint terre cuite que les WC, trois spots orientables.'},
  sdb:{pos:[1.9,3.1,2.9],target:[-.5,.7,.9],hide:['bath'],txt:'<strong>Salle d’eau.</strong> Rien n’est percé : barre de rideau télescopique, étagère d’angle à pression dans la douche pour les gels et l’enceinte étanche. Vasque collée à la cloison de la douche, lave-linge calé dans l’angle. Entre les deux, un meuble à linge en chêne à bac basculant, à hauteur du plan vasque : Le miroir est décalé vers la douche : à droite, un grand vase d’eucalyptus posé sur le meuble à linge fait contrepoids et rend le décalage volontaire. Parfums, crèmes et diffuseur sur son plateau, tapis de bain terre cuite.'},
  wc:{pos:[-.55,2.35,1.25],target:[-.6,.8,3.0],hide:['bath'],txt:'<strong>WC.</strong> Murs bicolores : papier peint terre cuite en bas jusqu’à 1,05 m, fine baguette en chêne, blanc au-dessus. Étagère colonne blanc et chêne à droite des toilettes : magazines à portée de main, papier toilette en vue, parfum et plantes. Tableau face au trône, à hauteur des yeux une fois assis. Dérouleur sur pied : rien n’est percé.'},
  cinema:{pos:[3.0,1.05,.45],target:[3.0,1.25,2.26],txt:'<strong>Mode cinéma.</strong> Rideaux tirés, lumière tamisée, la télé de 50 pouces sort du meuble au pied du lit. Environ 1,9 m entre l’oreiller et l’écran.'}
};
const caption=document.getElementById('caption'),captitle=document.getElementById('captitle'),capbox=document.getElementById('capbox'),captoggle=document.getElementById('captoggle');
function setCaption(t){const m=t.match(/^<strong>(.*?)<\/strong>\s*/);captitle.textContent=m?m[1].replace(/\.$/,''):'';caption.innerHTML=m?t.slice(m[0].length):t;}
let capOpen=window.innerWidth>=1024;try{const s=localStorage.getItem('capOpen');if(s!==null)capOpen=s==='1';}catch(e){}
function applyCap(){capbox.classList.toggle('collapsed',!capOpen);captoggle.setAttribute('aria-expanded',capOpen?'true':'false');}
captoggle.addEventListener('click',()=>{capOpen=!capOpen;applyCap();try{localStorage.setItem('capOpen',capOpen?'1':'0');}catch(e){}});applyCap();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween=null,current='ensemble';
function viewPos(v){const t=new THREE.Vector3(...v.target),p=new THREE.Vector3(...v.pos);
  if(v.fit&&camera.aspect<1.2){const k=Math.min(2.1,1.2/camera.aspect*.85);p.sub(t).multiplyScalar(Math.max(1,k)).add(t);}return {p,t};}
function go(name,instant){current=name;const v=views[name];const {p,t}=viewPos(v);innerHide=v.hide||[];setCaption(v.txt);
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===name?'true':'false'));
  if(instant||reduce){camera.position.copy(p);controls.target.copy(t);controls.update();tween=null;return;}
  tween={p0:camera.position.clone(),t0:controls.target.clone(),p,t,start:performance.now(),dur:900};}
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{if(mode==='cine'){setMode('soir');}go(b.dataset.v);}));
controls.addEventListener('start',()=>{tween=null;});
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>{downPos=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(!downPos)return;const dx=e.clientX-downPos[0],dy=e.clientY-downPos[1];downPos=null;if(dx*dx+dy*dy>64)return;
  const r=renderer.domElement.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  if(arc.parent&&ray.intersectObject(arc,true).length){arcTarget=arcTarget===ARC_BED?ARC_CHAIR:ARC_BED;if(reduce)arc.rotation.y=arcTarget;}});

const levels={
  jour:{sun:1.7,hemi:.62,fill:.25,pend:.45,lampL:.35,floorL:.3,kit:.35,wallk:.5,desk:.12,under:.2,emis:.45,cur:0,scr:0,work:0},
  soir:{sun:.06,hemi:.16,fill:.05,pend:.9,lampL:.6,floorL:1.0,kit:.9,wallk:1.0,desk:.35,under:.55,emis:1.1,cur:1,scr:0,work:0},
  cine:{sun:.06,hemi:.1,fill:.03,pend:0,lampL:.25,floorL:.3,kit:0,wallk:.1,desk:0,under:.1,emis:.55,cur:1,scr:1,work:0},
  travail:{sun:1.7,hemi:.62,fill:.25,pend:.2,lampL:.2,floorL:.5,kit:.1,wallk:.2,desk:.6,under:.1,emis:.6,cur:0,scr:0,work:1}};
const lv=Object.assign({},levels.jour);let mode='jour';
const modeBtns=document.querySelectorAll('.modes button');
function setMode(m){mode=m;modeBtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m?'true':'false'));if(reduce){Object.assign(lv,levels[m]);applyLights();}}
modeBtns.forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.m;setMode(m);arcTarget=m==='travail'?ARC_CHAIR:ARC_BED;if(reduce)arc.rotation.y=arcTarget;if(m==='cine')go('cinema');else if(m==='travail')go('bureau');else if(current==='cinema')go('nuit');}));
const tcK=wpTex.clone();tcK.needsUpdate=true;tcK.wrapS=tcK.wrapT=THREE.RepeatWrapping;tcK.repeat.set(11,4);const wpKitTC=new THREE.MeshStandardMaterial({map:tcK,roughness:.9});
kitWall.forEach(m=>{m.userData.mat=wpKitTC;if(m.material!==ghost)m.material=wpKitTC;});
function applyLights(){
  cur1.scale.x=.17+.83*lv.cur;cur2.scale.x=-(.22+.78*lv.cur);
  tv.position.y=TV0+.75*lv.scr;
  const glow=Math.max(0,(lv.scr-.6)/.4);screenMat.emissiveIntensity=glow*1.1;screenLight.intensity=glow*.6;
  sun.intensity=lv.sun;hemi.intensity=lv.hemi;fill.intensity=lv.fill;pend.intensity=lv.pend;lampL.intensity=lv.lampL;floorL.intensity=lv.floorL;
  deskL.intensity=lv.desk;underL.intensity=lv.under;kitL.intensity=lv.kit;wallL.intensity=lv.wallk;readL.intensity=lv.floorL*.6;lampR.intensity=lv.lampL;mat.lamp.emissiveIntensity=lv.emis;
  const dy=.35*(1-lv.work);deskTop.position.y=dy;deskLegs.forEach(l=>{l.scale.y=(.72+dy)/.72;l.position.y=(.72+dy)/2;});if(ocG)ocG.position.x=4.85-.67*lv.work;}

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();go('ensemble',true);applyLights();

let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(tween){const k=Math.min(1,(now-tween.start)/tween.dur);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p,e);controls.target.lerpVectors(tween.t0,tween.t,e);if(k>=1)tween=null;}
  {const tg=levels[mode];let ch=false;for(const k in tg){const d=tg[k]-lv[k];if(Math.abs(d)>.002){lv[k]+=d*Math.min(1,dt*2.5);ch=true;}else if(d!==0){lv[k]=tg[k];ch=true;}}if(ch)applyLights();}
  if(Math.abs(arcTarget-arc.rotation.y)>.001)arc.rotation.y+=(arcTarget-arc.rotation.y)*Math.min(1,dt*3);
  controls.update();updateWalls();renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
